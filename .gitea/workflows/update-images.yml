name: update-images

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update.sh"
      - "scripts/latest-versions.sh"
      - "Makefile"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "rakshak-bot"
          git config user.email "rakshak-bot@users.noreply.git.sable-chinstrap.ts.net"

      - name: Login to Gitea Container Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.sable-chinstrap.ts.net -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Check for updates
        run: ./scripts/update.sh --check

      - name: Apply updates
        run: ./scripts/update.sh
